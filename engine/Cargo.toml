[package]
name = "qdf-engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "DuckDB engine process for the Query Data Files VS Code extension"

[dependencies]
duckdb = { version = "=1.10505.0", default-features = false }
arrow = { version = "58", default-features = false, features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
